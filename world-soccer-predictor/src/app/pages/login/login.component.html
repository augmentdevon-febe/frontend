<main class="page">
  <section class="panel">
    <h1 class="title">{{ branding.appTitle }}</h1>
    <p class="subtitle">{{ branding.loginSubtitle }}</p>

    <div class="row login-actions">
      <button type="button" mat-raised-button color="accent" (click)="startLogin()" [disabled]="isLoginInProgress">
        Login with Google
      </button>
      <button type="button" mat-stroked-button color="accent" (click)="startSwitchAccount()" [disabled]="isLoginInProgress">
        Use a different Google account
      </button>
      <mat-spinner diameter="28" *ngIf="isCheckingSession || isLoginInProgress"></mat-spinner>
    </div>

    <p class="message-error" *ngIf="loginError">{{ loginError }}</p>
  </section>
</main>
