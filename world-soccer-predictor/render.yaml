services:
  - type: web
    name: world-soccer-predictor-frontend
    runtime: static
    rootDir: world-soccer-predictor
    buildCommand: npm install && echo "window.__APP_CONFIG__={API_BASE_URL:'$API_BASE_URL'};" > public/app-config.js && npm run build
    staticPublishPath: dist/world-soccer-predictor/browser
    pullRequestPreviewsEnabled: true
    envVars:
      - key: API_BASE_URL
        sync: false
      - key: NODE_VERSION
        value: 24.15.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
